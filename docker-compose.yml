# OPERATION 444 - Docker Network Environment

services:
  firewall:
    build: ./firewall
    container_name: lab-firewall
    cap_add:
      - NET_ADMIN # Manage firewall rules
      - NET_RAW # Support raw network operations
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      external_net:
        ipv4_address: 192.168.10.2
      internal_net:
        ipv4_address: 192.168.20.2

  server:
    build: ./server
    container_name: lab-server
    command:
      - "sh"
      - "-c"
      - "ip route replace 192.168.10.0/24 via 192.168.20.2;
         ssh-keygen -A;
         /usr/sbin/sshd;
         python hr_portal.py & exec python app.py"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./results:/results
    networks:
      internal_net:
        ipv4_address: 192.168.20.10

  attacker:
    build: ./attacker
    container_name: lab-attacker

    command:
      - "sh"
      - "-c"
      - "ip route replace 192.168.20.0/24 via 192.168.10.2 && exec python3 /lab/interface.py"

    cap_add:
      - NET_ADMIN # Configure network routes
      - NET_RAW # Support Scapy raw packets

    ports:
      - "127.0.0.1:5001:5001" # Attacker Interface

    volumes:
      - ./attacker:/lab # Access attacker scripts
      - ./results:/results # Store experiment results

    networks:
      external_net:
        ipv4_address: 192.168.10.3

  dashboard:
    build: ./dashboard
    container_name: lab-dashboard

    command:
      - "sh"
      - "-c"
      - "ip route replace 192.168.20.0/24 via 192.168.10.2 && exec python app.py"

    cap_add:
      - NET_ADMIN

    ports:
      - "127.0.0.1:5000:5000" # Company Dashboard

    networks:
      external_net:
        ipv4_address: 192.168.10.4

    depends_on:
      - firewall

networks:
  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1

  internal_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.1