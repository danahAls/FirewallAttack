### Here is where the containers are going to be defined, attacker container, server, firewall.
### And the network topology so the network design is clear to docker

# All the continers are going to be here (firewall, server, attacker). Also it specifies the privliges they have
services:
  firewall:
    build: ./firewall
    container_name: lab-firewall
    cap_add:
      - NET_ADMIN              # allows editing firewall rules and routing
      - NET_RAW                # allow sending raw packets later
    sysctls:
      - net.ipv4.ip_forward=1  # enable packet forwarding
    networks:
      external_net:
        ipv4_address: 192.168.10.2
      internal_net:
        ipv4_address: 192.168.20.2

  server:
    build: ./server
    container_name: lab-server
    command: ["sh", "-c", "ip route replace 192.168.10.0/24 via 192.168.20.2 && ssh-keygen -A && /usr/sbin/sshd && exec python app.py"]
    cap_add:
      - NET_ADMIN
    networks:
      internal_net:
        ipv4_address: 192.168.20.10
  # Define the attacker container
  attacker:

    # Build the image using the Dockerfile in the attacker folder
    build: ./attacker

    # Give the running container a recognizable name
    container_name: lab-attacker
    command: ["sh", "-c", "ip route replace 192.168.20.0/24 via 192.168.10.2 && exec sleep infinity"]
    # Allow the container to configure its own network routes
    cap_add:
      - NET_ADMIN

    # Connect the attacker to the external network
    networks:
      external_net:

        # Assign a fixed IP address to the attacker
        ipv4_address: 192.168.10.3
    # Visual interface: shows server status and firewall counters in a browser
  dashboard:
    build: ./dashboard
    container_name: lab-dashboard
    # Route to the server network goes through the firewall
    command: ["sh", "-c", "ip route replace 192.168.20.0/24 via 192.168.10.2 && exec python app.py"]
    cap_add:
      - NET_ADMIN             
    ports:
      - "127.0.0.1:5000:5000"  # open browser at http://localhost:5000
    networks:
      external_net:
        ipv4_address: 192.168.10.4   # the only IP the firewall lets read port 8080
    depends_on:
      - firewall


# Network design is here. there is only two netwroks
networks:
  external_net:
    driver: bridge # driver is the the virtual network docker make and driver is the type of the driver. here it's a switch that connects internally and externally
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1

  internal_net:
    driver: bridge
    internal: true #now the bridge(switch) only connect internally 
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.1
